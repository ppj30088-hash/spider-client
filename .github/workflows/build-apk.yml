# Builds spider client for Android and publishes the APKs (one per
# architecture: arm64-v8a, armeabi-v7a, x86_64) in Releases. Run it from the
# Actions tab ("Run workflow"), or push to main.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: stable
          build-number: '999'
          sign: 'true'

      # A failed build: the errors and the end of the log as an annotation of
      # the run (the Actions page shows it at the top).
      - name: What failed
        if: failure()
        run: |
          python3 - <<'PY'
          import os,re
          path=os.environ['GITHUB_WORKSPACE']+'/build.log'
          lines=open(path,errors='replace').read().splitlines() if os.path.exists(path) else ['(no log)']
          errs=[l.strip()[:300] for l in lines if re.search(r'(Could not|Caused by|Cannot|not found|^e: |error:|FAILED|What went wrong|Unresolved|No matching|undefined|fatal)',l) and not l.strip().startswith('at ')][:80]
          text='\n'.join(errs+['---- end of the log ----']+[l[:300] for l in lines[-50:]])
          text=text.replace('%','%25').replace('\r','').replace('\n','%0A')
          print('::error title=Build failed::'+text[:30000])
          PY

      - name: Collect the APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -print -exec cp {} out/ \;
          ls -la out
          (cd out && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: out/
          if-no-files-found: error

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "spider client build ${GITHUB_RUN_NUMBER}" \
            --notes "Android APKs: arm64-v8a (most phones), armeabi-v7a (older 32-bit phones), x86_64 (emulators). Built from ${GITHUB_SHA}."
