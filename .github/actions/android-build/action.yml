name: Android build
description: >-
  Shared build steps of ci.yml and release.yml (preview and stable): JDK 17, Flutter module AAR (the gitignored
  flutter/build/host/outputs/repo the app links), ThroneCore AAR + sing-box schema, routeprofiles
  snapshot, sing-box dashboard, Gradle, then ./gradlew <tasks>. With sign=true, release builds are signed with the
  SIGNING_* secrets from the job environment; the build fails without them.
inputs:
  tasks:
    description: Gradle tasks to run
    required: true
  channel:
    description: stable or preview (BuildConfig.PREVIEW, versionName suffix -pre.<build-number>)
    required: false
    default: stable
  build-number:
    description: last three digits of versionCode (999 stable tag build, commits since the last stable tag for previews)
    required: false
    default: '0'
  sign:
    description: sign release builds (true/false)
    required: false
    default: 'false'
  reuse-inputs:
    description: >-
      Skip the four input-preparation steps (Flutter AAR, ThroneCore, routeprofiles,
      dashboard) because Release downloaded the CI-built inputs. Fails fast if any
      input is missing, so a partial artifact can never produce a broken APK.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # The runner image ships several GB of toolchains this build never uses
    # (.NET alone is ~2 GB); the Go core + Flutter + Gradle build fills the
    # disk to the edge and the Gradle cache save then fails with "No space
    # left on device" (seen on CI runs 43655513522 and 43662146934). Free that
    # space up front. The Android SDK and the tool caches stay untouched.
    - name: Free disk space
      shell: bash
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet
        df -h / | tail -1
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    # The NDK the app's ndkVersion asks for, installed before the Flutter AAR: without it the
    # first Gradle build auto-installs it mid-build, where a truncated dl.google.com download
    # (seen 2026-11-02) fails the run with no retry. Three tries ride out a flaky CDN.
    - name: Install NDK
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          # printf, not yes: `yes |` dies of a broken pipe when sdkmanager stops reading,
          # and with pipefail that reads as a failure even after a clean install. Four y's
          # cover a runner image that ever ships more than one unaccepted license.
          if printf 'y\ny\ny\ny\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"; then
            break
          fi
          if [ "$attempt" = "3" ]; then
            echo "::error::NDK 28.2.13676358 failed to install three times"
            exit 1
          fi
          sleep 20
        done
    # The app links io.flrone.ui:flutter_release:1.0 from flutter/build/host/outputs/repo, which the
    # repository ignores; without this step the Gradle build cannot resolve the B-box interface at all.
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        # Pinned to the toolchain the AAR is developed against; `flutter --version` on the dev box is the source.
        flutter-version: '3.47.9'
        cache: true
    - name: Flutter AAR
      if: inputs.reuse-inputs != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd flutter
        flutter pub get
        flutter build aar --no-debug --no-profile
    - name: ThroneCore AAR and schema
      if: inputs.reuse-inputs != 'true'
      uses: ./.github/actions/throne-core
    - name: Fetch routeprofiles snapshot
      if: inputs.reuse-inputs != 'true'
      uses: ./.github/actions/routeprofiles
    - name: Fetch sing-box dashboard
      if: inputs.reuse-inputs != 'true'
      uses: ./.github/actions/sing-box-dashboard
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
    - name: Verify reused build inputs
      if: inputs.reuse-inputs == 'true'
      shell: bash
      run: |
        set -euo pipefail
        missing=0
        check() {
          if [ ! -e "$1" ]; then
            echo "::error::reused build input is missing: $1"
            missing=1
          fi
        }
        check flutter/build/host/outputs/repo
        check app/libs/ThroneCore.aar
        check app/src/main/assets/schema/sing-box.json
        check app/src/main/assets/routeprofiles/srslist.h
        check app/src/main/assets/sb-dashboard
        [ "$missing" = 0 ] || exit 1
        echo "Reused CI build inputs are complete."
    # Aether's WARP registration calls api.devices.cloudflare.com, which the
    # phone's network blocks, so the helper can never get an account there
    # (pre.16 failed on "registration retry 2/4"). Register the MASQUE
    # identity here, on the runner, where the API answers, and bundle it in
    # the APK: the phone then loads the saved identity and never calls the
    # API at all (verified: with the API forced unreachable, the helper logs
    # "loaded existing masque identity" and goes straight to scanning, with
    # zero registration attempts). The identity is a free, disposable WARP
    # account (device id + token + WireGuard/MASQUE keys); it is generated
    # fresh on every run, lives only on the runner and inside the built APK,
    # and is never committed — app/src/main/assets/aether/ is gitignored.
    # The certificate is good for 365 days, so a release stays usable long
    # after its build. The build fails if registration fails, so a release
    # can never ship without the identity.
    - name: Pre-register Aether identity
      shell: bash
      run: |
        set -euo pipefail
        AETHER_VERSION=2.4.0
        WORK="$RUNNER_TEMP/aether-identity"
        mkdir -p "$WORK"
        cd "$WORK"
        for attempt in 1 2 3; do
          if curl -fsSL -o aether-linux.tar.gz "https://github.com/CluvexStudio/Aether/releases/download/v${AETHER_VERSION}/aether-linux-x86_64.tar.gz" \
            && curl -fsSL -o SHA256SUMS.txt "https://github.com/CluvexStudio/Aether/releases/download/v${AETHER_VERSION}/SHA256SUMS.txt"; then
            break
          fi
          if [ "$attempt" = "3" ]; then
            echo "::error::aether $AETHER_VERSION failed to download three times"
            exit 1
          fi
          sleep 20
        done
        EXPECTED=$(awk '$2 == "aether-linux-x86_64.tar.gz" { print $1 }' SHA256SUMS.txt)
        test -n "$EXPECTED"
        ACTUAL=$(sha256sum aether-linux.tar.gz | cut -d' ' -f1)
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::aether download checksum mismatch"
          exit 1
        fi
        tar xzf aether-linux.tar.gz aether
        ./aether --register masque --config "$WORK/aether.toml" --log-level info
        test -s "$WORK/aether-masque.toml"
        # Field names only: the file holds account secrets and must never be
        # printed. A missing field means registration produced a useless file.
        for field in device_id access_token cert_pem key_pem cert_issued_at wg_private_key wg_peer_public_key; do
          grep -q "^$field =" "$WORK/aether-masque.toml" || {
            echo "::error::pre-registered masque identity is missing $field"
            exit 1
          }
        done
        mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/aether"
        cp "$WORK/aether-masque.toml" "$GITHUB_WORKSPACE/app/src/main/assets/aether/aether-masque.toml"
        echo "Pre-registered Aether MASQUE identity bundled for the APK."
    - name: Gradle build
      shell: bash
      env:
        THRONE_CHANNEL: ${{ inputs.channel }}
        THRONE_BUILD: ${{ inputs.build-number }}
        THRONE_SIGN: ${{ inputs.sign }}
      run: |
        set -euo pipefail
        if [ "$THRONE_SIGN" = "true" ]; then
          if [ -n "${SIGNING_KEYSTORE_B64:-}" ]; then
            : "${SIGNING_STORE_PASSWORD:?the SIGNING_STORE_PASSWORD secret is missing}"
            : "${SIGNING_KEY_ALIAS:?the SIGNING_KEY_ALIAS secret is missing}"
            KS="$RUNNER_TEMP/release-signing.keystore"
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode --ignore-garbage > "$KS"
            UPDATE_SIGNER_SHA256=$(keytool -exportcert -keystore "$KS" -storepass "$SIGNING_STORE_PASSWORD" \
              -alias "$SIGNING_KEY_ALIAS" | sha256sum | cut -d' ' -f1)
            rm -f "$KS"
            export UPDATE_SIGNER_SHA256
            echo "Signing with the release key from the repository secrets (certificate SHA-256 $UPDATE_SIGNER_SHA256)"
          else
            echo "::error::No signing key: add the SIGNING_* repository secrets"
            exit 1
          fi
        else
          unset SIGNING_KEYSTORE_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD
        fi
        ./gradlew --stacktrace ${{ inputs.tasks }}
